{{define "page"}}
<h1>{{.Category.Name}}</h1>
<form method="post" action="/{{.Category.ID}}">
  <label>Value
    <input type="number" step="any" name="value" required>
  </label>
  <label>From
    <select name="from">{{range .Category.Units}}
      <option value="{{.ID}}"{{if eq .ID $.From}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </label>
  <label>To
    <select name="to">{{range .Category.Units}}
      <option value="{{.ID}}"{{if eq .ID $.To}} selected{{end}}>{{.Name}}</option>{{end}}
    </select>
  </label>
  <button type="submit">Convert</button>
</form>
{{end}}
