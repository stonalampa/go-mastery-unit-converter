version: "2"

linters:
  default: standard
  enable:
    - revive
  settings:
    errcheck:
      # A CLI has nowhere to report a failed write to stdout/stderr.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofmt
    - goimports
